<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Malla de Turnos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet"
          href="styles.css">

</head>

<body>

<div class="container-fluid p-4">

    <!-- ========================================= -->
    <!-- CABECERA -->
    <!-- ========================================= -->

    <div class="row mb-4">

        <div class="col-md-8">

            <h2 class="titulo">
                Malla de Turnos
            </h2>

            <h5 class="subtitulo">
                Julio 2026
            </h5>

        </div>

        <div class="col-md-4">

            <label class="form-label">

                Mostrar empleado

            </label>

            <select
                id="filtroEmpleado"
                class="form-select">
                <option value="todos"> Todos </option>
                <option value="Jessica"> Jessica </option>
                <option value="Isa"> Isa </option>
                <option value="Nata"> Nata </option>
                <option value="Lore"> Lore </option>
                <option value="Lei"> Lei </option>
                <option value="Jefer"> Jefer </option>
            </select>

        </div>

    </div>

    <!-- ========================================= -->
    <!-- LEYENDA -->
    <!-- ========================================= -->

    <div class="row mb-4">

        <div class="col">

            <div class="legend">

                <span class="legend-item">

                    <span class="color apertura"></span>

                    Apertura

                </span>

                <span class="legend-item">

                    <span class="color cierre"></span>

                    Cierre

                </span>

                <span class="legend-item">

                    <span class="color normal"></span>

                    Normal

                </span>

            </div>

        </div>

    </div>

    <!-- ========================================= -->
    <!-- CALENDARIO -->
    <!-- ========================================= -->

    <div class="calendar">

        <div class="calendar-header">

            <div>Lunes</div>
            <div>Martes</div>
            <div>Miércoles</div>
            <div>Jueves</div>
            <div>Viernes</div>
            <div>Sábado</div>
            <div>Domingo</div>

        </div>

        <div
            id="calendarBody"
            class="calendar-body">

            <!--
                El calendario será generado
                automáticamente desde app.js
            -->

        </div>

    </div>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Javascript -->

<script src="app.js?t=1"></script>

</body>
</html>
